name: Track MediaInfo upstream

on:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: update-mediainfo-upstream
  cancel-in-progress: false

jobs:
  update:
    name: Open stable-release update PR
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository and pinned sources
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Resolve latest stable upstream releases
        id: upstream
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/update_mediainfo_upstream.py
          --apply-latest
          --github-output "$GITHUB_OUTPUT"

      - name: Verify and stage the updated source lock
        if: steps.upstream.outputs.changed == 'true'
        run: |
          git add \
            native/upstream/MediaInfoLib \
            native/upstream/ZenLib \
            native/upstream.lock.json \
            app/src/main/assets/licenses
          python3 scripts/verify_native_build.py
          git diff --cached --check

      - name: Commit and push the update branch
        if: steps.upstream.outputs.changed == 'true'
        env:
          UPDATE_BRANCH: automation/update-mediainfo-upstream
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(native): update pinned MediaArea sources"
          git fetch origin "$UPDATE_BRANCH:refs/remotes/origin/$UPDATE_BRANCH" || true
          git push --force-with-lease origin "HEAD:refs/heads/$UPDATE_BRANCH"

      - name: Create or refresh the draft pull request
        if: steps.upstream.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_BRANCH: automation/update-mediainfo-upstream
          MEDIAINFO_TAG: ${{ steps.upstream.outputs.mediainfo_tag }}
          MEDIAINFO_COMMIT: ${{ steps.upstream.outputs.mediainfo_commit }}
          ZENLIB_TAG: ${{ steps.upstream.outputs.zenlib_tag }}
          ZENLIB_COMMIT: ${{ steps.upstream.outputs.zenlib_commit }}
        run: |
          title="chore(native): update MediaInfoLib to ${MEDIAINFO_TAG}"
          body_file="${RUNNER_TEMP}/mediainfo-upstream-pr.md"
          cat > "$body_file" <<EOF
          Automated stable-release tracking update.

          - MediaInfoLib: \`${MEDIAINFO_TAG}\` (\`${MEDIAINFO_COMMIT}\`)
          - ZenLib: \`${ZENLIB_TAG}\` (\`${ZENLIB_COMMIT}\`)

          This PR only moves immutable source pins, refreshes the source lock and license copies. It is intentionally a draft: full JVM, four-ABI, 4 KB / 16 KB emulator, ARM64 physical-device, real-media, timeout and authorized large-file regression gates still require review. This workflow never merges the PR and never creates a Release.
          EOF
          pr_url="$(gh pr list --state open --base master --head "$UPDATE_BRANCH" --json url --jq '.[0].url')"
          if [ -n "$pr_url" ]; then
            gh pr edit "$pr_url" --title "$title" --body-file "$body_file"
          else
            gh pr create \
              --draft \
              --base master \
              --head "$UPDATE_BRANCH" \
              --title "$title" \
              --body-file "$body_file"
          fi

      - name: Dispatch the full build integrity workflow
        if: steps.upstream.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_BRANCH: automation/update-mediainfo-upstream
        run: gh workflow run build.yml --ref "$UPDATE_BRANCH"

name: Build integrity

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-build:
    name: Unit tests and debug APKs
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Verify pinned upstream sources
        run: |
          python3 scripts/update_mediainfo_upstream.py --fetch-locked
          python3 scripts/verify_native_build.py

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Install pinned native toolchain
        run: sdkmanager "ndk;29.0.14206865" "cmake;3.22.1"

      - name: Run unit tests and assemble debug APKs
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Verify all packaged native architectures
        run: >-
          python3 scripts/verify_native_build.py
          --library-root
          app/build/intermediates/stripped_native_libs/debug/stripDebugDebugSymbols/out/lib
          --apk-dir
          app/build/outputs/apk/debug

  verify-service:
    name: Plugin service round trip
    needs: verify-build
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Verify pinned upstream sources
        run: |
          python3 scripts/update_mediainfo_upstream.py --fetch-locked
          python3 scripts/verify_native_build.py

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Install pinned native toolchain
        run: sdkmanager "ndk;29.0.14206865" "cmake;3.22.1"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Verify discovery and Binder methods
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          script: |
            chmod +x gradlew
            ./gradlew :app:connectedDebugAndroidTest --stacktrace

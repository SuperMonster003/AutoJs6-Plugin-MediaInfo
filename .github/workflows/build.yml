name: Build integrity

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-build:
    name: Unit tests and debug/release APKs
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Verify pinned upstream sources
        run: |
          python3 scripts/update_mediainfo_upstream.py --fetch-locked
          python3 scripts/verify_native_build.py

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Install pinned native toolchain
        run: |
          sdkmanager_path="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager_path"
          "$sdkmanager_path" "ndk;29.0.14206865" "cmake;3.22.1"
          test -d "${ANDROID_HOME}/ndk/29.0.14206865"
          test -x "${ANDROID_HOME}/cmake/3.22.1/bin/cmake"

      - name: Run unit tests and assemble debug/release APKs
        run: |
          chmod +x gradlew
          ./gradlew \
            -Pmediainfo.releaseSmokeDebugSigning=true \
            :app:testDebugUnitTest \
            :app:assembleDebug \
            :app:assembleRelease \
            --stacktrace

      - name: Verify all packaged native architectures
        run: |
          python3 scripts/verify_native_build.py \
            --library-root app/build/intermediates/stripped_native_libs/debug/stripDebugDebugSymbols/out/lib \
            --apk-dir app/build/outputs/apk/debug
          python3 scripts/verify_native_build.py \
            --library-root app/build/intermediates/stripped_native_libs/release/stripReleaseDebugSymbols/out/lib \
            --apk-dir app/build/outputs/apk/release

  verify-service:
    name: Debug and minified release service round trip
    needs: verify-build
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Verify pinned upstream sources
        run: |
          python3 scripts/update_mediainfo_upstream.py --fetch-locked
          python3 scripts/verify_native_build.py

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Install pinned native toolchain
        run: |
          sdkmanager_path="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager_path"
          "$sdkmanager_path" "ndk;29.0.14206865" "cmake;3.22.1"
          test -d "${ANDROID_HOME}/ndk/29.0.14206865"
          test -x "${ANDROID_HOME}/cmake/3.22.1/bin/cmake"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Verify debug and minified release discovery/Binder methods
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          script: |
            chmod +x gradlew
            ./gradlew \
              -Pmediainfo.releaseSmokeDebugSigning=true \
              :app:assembleRelease \
              :app:assembleDebugAndroidTest \
              --stacktrace
            release_apk="app/build/outputs/apk/release/app-x86_64-release.apk"
            test_apk="app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk"
            test -f "$release_apk"
            test -f "$test_apk"
            cleanup_release_smoke() {
              adb uninstall io.github.supermonster003.autojs6.plugin.mediainfo.test >/dev/null 2>&1 || true
              adb uninstall io.github.supermonster003.autojs6.plugin.mediainfo >/dev/null 2>&1 || true
            }
            trap cleanup_release_smoke EXIT
            adb install -t "$release_apk"
            adb install -t "$test_apk"
            release_output="$(adb shell am instrument -w -r \
              -e class io.github.supermonster003.autojs6.plugin.mediainfo.MediainfoReleaseSmokeTest \
              io.github.supermonster003.autojs6.plugin.mediainfo.test/androidx.test.runner.AndroidJUnitRunner)"
            printf '%s\n' "$release_output"
            printf '%s\n' "$release_output" | grep -q 'OK (1 test)'
            cleanup_release_smoke
            ./gradlew :app:connectedDebugAndroidTest --stacktrace
